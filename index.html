<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organización de Asamblea Regional</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241a1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light dark;--bg0:#f7f3f4;--bg1:#fff;--bg2:#f1e9ec;--bg3:#e7dbdf;--ac:#8b1a3a;--ac2:#7a1431;--t0:#2a1a1f;--t1:#4a3a40;--t2:#7a6a70;--bd:#e0d3d7;--dg:#c0263f}
@media(prefers-color-scheme:dark){:root{--bg0:#1a1115;--bg1:#241a1f;--bg2:#2f2329;--bg3:#3a2c33;--ac:#e0698a;--ac2:#a82a4c;--t0:#f5eef0;--t1:#cdbfc4;--t2:#9a8a90;--bd:#3d2f36;--dg:#ef6a7f}}
body{margin:0;background:var(--bg0);color:var(--t0);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
#top{position:sticky;top:0;z-index:20;background:var(--bg1);border-bottom:1px solid var(--bd)}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px}
.lg{width:34px;height:34px;border-radius:10px;background:var(--ac2);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(122,20,49,.3)}
.lg svg,nav svg{fill:none;stroke-linecap:round;stroke-linejoin:round}.lg svg{width:20px;height:20px;stroke:#fff;stroke-width:1.8}
#ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#ev select{max-width:46vw}
nav{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:74px;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--t2);font-size:11px;font-weight:500;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8}
nav button.on{color:var(--ac);border-bottom-color:var(--ac);background:none}
main{padding:14px;max-width:1200px;margin:auto}
button,select,input{font:inherit;color:var(--t0);background:var(--bg1);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer;background:var(--bg2)}button:active{background:var(--bg3)}button:disabled{opacity:.5;cursor:default}
button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
input[type=checkbox]{width:auto;accent-color:var(--ac2)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
h2{font-size:17px;margin:.3em 0;letter-spacing:-.01em}.mu{color:var(--t2);font-size:13px}.wn{color:var(--dg)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--t2)}.f input{width:100%}
.w{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg1)}
td,th{border-bottom:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--bg2);font-size:12px}tr:last-child>td,tr:last-child>th{border-bottom:0}
.cd{background:var(--bg1);border:1px solid var(--bd);border-left:4px solid var(--ac2);border-radius:12px;padding:12px;margin:10px 0}
.cd select{width:100%;margin:3px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.bx{border:2px solid var(--ac2);border-radius:8px;padding:6px 8px;margin:8px 0;font-size:13px;background:var(--bg1)}
.bx b{display:block}.t{text-align:center}.r{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){.g3{grid-template-columns:1fr}}
@media print{#top,.np{display:none}:root{--bg0:#fff;--bg1:#fff;--bg2:#eee;--t0:#000;--t2:#555;--bd:#999;--ac:#7a1431;--ac2:#7a1431}body{background:#fff}}
.cb{position:relative}.cb input{width:100%;margin:3px 0}
.cbl{position:absolute;left:0;right:0;top:100%;z-index:40;max-height:min(42vh,280px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg1);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:4px}.cbl[hidden]{display:none}
.cbo{padding:10px;border-radius:7px;cursor:pointer}.cbo.on,.cbo:hover{background:var(--bg2)}.cbo small{color:var(--t2)}
.ah{color:#000;padding:6px 10px;border-radius:8px 8px 0 0;margin:14px 0 0;font-size:15px;border:2px solid var(--ac2);border-bottom:0}
.tf{border:2px solid var(--ac2);border-radius:0 0 10px 10px}.tf th,.tf td{border-right:1px solid var(--bd)}.tf th:last-child,.tf td:last-child{border-right:0}
.tf thead th{background:var(--ac2);color:#fff}.tf .dp{color:#000;font-size:13px}.tf tbody tr:nth-child(even) td{background:var(--bg2)}
@media(pointer:coarse){input,select,textarea{font-size:16px}}
@media print{.ah,.tf th,.tf td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="top"><header><div class="lg"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/></svg></div><div id="ttl">Asamblea Regional</div><span id="ev"></span></header><nav id="nv"></nav></div><main id="v"></main>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/exceljs.min.js"></script>
<script>
const D=(id,n,o={})=>({id,n,...o});
const AREAS=[
{id:'AC',h:'Coordinador del Comité de Asamblea',deps:[D('acom','Acomodadores'),D('cont','Contabilidad'),D('est','Estacionamiento'),D('pa','Primeros Auxilios'),D('seg','Seguridad',{co:1})]},
{id:'AP',h:'Superintendente del programa',deps:[D('av','Audio y Video',{av:1}),D('bau','Bautismo'),D('it','Interpretación táctil (solo lengua de señas)',{opt:1})]},
{id:'AA',h:'Superintendente de Alojamiento',deps:[D('alo','Alojamiento'),D('isv','Información y Servicio Voluntario'),D('ins','Instalación',{opt:1}),D('lim','Limpieza'),D('ogg','Objetos Perdidos y Guardarropa'),D('tm','Transporte y Materiales',{opt:1}),D('agua','Agua potable')]}];
const DEF={asm:{nombre:'Felices para siempre',tit2:'PACHUCA HGO. #01 | 22/05/26 - 24/05/26',recinto:'Auditorio Gota de Plata de Pachuca de Soto, Hgo.',ciudad:'Pachuca Hidalgo',fechas:'22-24 de mayo 2026',fcarta:''},people:[],as:{},pres:{},log:[],cs:{}};
let S=JSON.parse(JSON.stringify(DEF)),T='asm',AR='AC',TPL=null,DL=null;
let EV;try{EV=JSON.parse(localStorage.getItem('asamblea-ev'))}catch(e){}
if(!EV||!EV.list||!EV.list.length){let o;try{o=JSON.parse(localStorage.getItem('asamblea-v1'))}catch(e){}EV={cur:'e1',list:[{id:'e1',n:(o&&o.asm&&o.asm.nombre)||'Asamblea 1'}]};if(o)S=Object.assign(S,o)}
else{try{const j=localStorage.getItem('asamblea-e-'+EV.cur);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
const save=()=>{try{localStorage.setItem('asamblea-ev',JSON.stringify(EV));localStorage.setItem('asamblea-e-'+EV.cur,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.people.find(p=>p.id==id),uid=()=>Math.random().toString(36).slice(2,9);
const pres=d=>S.pres[d.id]!==undefined?S.pres[d.id]:!d.opt;
const slots=d=>[d.co?'Coordinador':'Superintendente',...(d.av?['Auxiliar Audio','Auxiliar Video','Auxiliar Plataforma']:['Auxiliar','Auxiliar','Auxiliar'])];
const used=()=>new Set(Object.entries(S.as).filter(([k])=>{const i=k.split(':')[0];const d=AREAS.flatMap(a=>a.deps).find(x=>x.id==i);return !d||pres(d)}).map(e=>e[1]));
const nm=k=>{const p=P(S.as[k]);return p?esc(p.nombre):'<span class="mu">—</span>'};
(window.claude?window.claude.use('downloads'):Promise.resolve(null)).then(d=>{DL=d;if(T=='cartas'||T=='asm')render()}).catch(()=>{});
const idb=(m,v,k='tpl')=>new Promise(r=>{try{const q=indexedDB.open('asm',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{const s=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k');const x=m=='get'?s.get(k):m=='del'?s.delete(k):s.put(v,k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(e){r()}});

async function sv(name,data){if(!DL){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();return}try{await DL.save({filename:name,data})}catch(e){if(e.code!='declined')alert('No se pudo guardar: '+(e.message||e.code))}}
const ICO={'log':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>','asm': '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', 'dir': '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.4 3.6 5.2"/>', 'asg': '<path d="M9 6h12M9 12h12M9 18h12M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>', 'org': '<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/>', 'dds': '<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9zM14 3v6h6M8 13h8M8 17h8"/>', 'dpt': '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>', 'cartas': '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/>'};
const TABS=[['asm','Asamblea'],['dir','Directorio'],['asg','Asignación'],['org','Organigrama'],['dds','Directorios'],['dpt','Dir. dptos.'],['cartas','Cartas'],['log','Registro']];
const go=t=>{T=t;render()};
function render(){document.getElementById('ev').innerHTML=evSel();document.getElementById('nv').innerHTML=TABS.map(([k,n])=>`<button class="${k==T?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICO[k]}</svg>${n}</button>`).join('');
document.getElementById('v').innerHTML=({asm:vAsm,dir:vDir,asg:vAsg,org:vOrg,dds:vDds,dpt:vDpt,cartas:vCartas,log:vLog})[T]();if(T=='dir')tb();if(T=='log')lgb()}
function hdr(){const a=S.asm;return `<div class="t"><h2>${esc(a.nombre)}</h2><div>${esc(a.tit2)}</div><div class="mu">${esc(a.recinto)}</div></div>`}
/* Asamblea */
function vAsm(){const L={nombre:'Nombre de la asamblea',tit2:'Encabezado (línea 2)',recinto:'Lugar / recinto (línea 3)',ciudad:'Sede (texto de la carta)',fechas:'Fechas (texto de la carta)',codigo:'Código para nombrar archivos (ej. AR27-S001)'};
return `<h2>Datos de la asamblea</h2><p class="mu">Se usan como encabezado en organigrama, directorios y cartas.</p><div class="f">${Object.keys(L).map(k=>`<label>${L[k]}<input value="${esc(S.asm[k])}" oninput="S.asm.${k}=this.value;save()"></label>`).join('')}</div>
<h2 style="margin-top:20px">Presidente de la Asamblea Regional</h2><div class="cd"><span class="mu">Opcional; también puede llenarse a mano en el directorio impreso.</span>${sel('PR')}</div>
${cartaCfg()}
<h2 style="margin-top:20px">Tu nombre</h2><div class="f"><label>Aparece en el registro de cambios<input value="${esc(lsg('asamblea-user')||'')}" onchange="lss('asamblea-user',this.value.trim())"></label></div>
<h2 style="margin-top:20px">Eventos</h2><p class="mu">Cada evento tiene su propio directorio, asignaciones y datos. Cambia de evento con el selector de arriba. Un evento nuevo empieza vacío: importa su directorio (CSV o PDF).</p><div class="r"><button onclick="evNew(0)">Nuevo evento</button><button onclick="evRen()">Renombrar</button><button onclick="evDel()">Eliminar</button></div>
<h2 style="margin-top:20px">Respaldos</h2><p class="mu">Se genera un archivo por evento; al importar se agrega como evento nuevo.</p><div class="r"><button onclick="expOne()">Exportar este evento</button><button onclick="expAll()">Exportar todos</button><label>Importar respaldo: <input type="file" accept=".json" onchange="impJ(this)"></label></div>`}
async function impJold(i){try{const o=JSON.parse(await i.files[0].text());if(!o.asm||!o.people)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();render()}catch(e){alert('Archivo de respaldo no válido.')}}
/* Directorio */
let FL='all';
const live=k=>{const i=k.split(':')[0];const d=AREAS.flatMap(a=>a.deps).find(x=>x.id==i);return !d||pres(d)};
const keysOf=id=>Object.keys(S.as).filter(k=>S.as[k]==id&&live(k));
const isDep=k=>!/^(A[CPA]:|PR$)/.test(k);
function kl(k){if(k=='PR')return'Presidente de la asamblea';const a=AREAS.find(x=>k.startsWith(x.id+':'));if(a)return k.endsWith(':h')?a.h:'Auxiliar de '+a.h;const d=AREAS.flatMap(x=>x.deps).find(x=>x.id==k.split(':')[0]);return d?slots(d)[+k.split(':')[1]]+' · '+d.n:'—'}
function match(p,f){if(f=='all')return true;if(f=='no')return !!p.no;if(p.no)return false;const ks=keysOf(p.id);if(f=='free')return !ks.length;if(f=='asg')return ks.length>0;const [t,v]=f.split(':');
return ks.some(k=>{const i=k.split(':')[0],n=k.split(':')[1];if(t=='area'){const a=AREAS.find(x=>x.id==v);return k.startsWith(v+':')||a.deps.some(d=>d.id==i)}
if(t=='dep')return i==v;if(t=='role'){if(v=='pres')return k=='PR';if(v=='jefe')return/^A[CPA]:h$/.test(k);if(v=='axa')return/^A[CPA]:x$/.test(k);if(v=='sup')return isDep(k)&&n=='0';return isDep(k)&&+n>0}return false})}
function where(p){if(p.no)return'Sin participación';const ks=keysOf(p.id);return ks.length?ks.map(kl).join(', '):'Libre'}
const flOpts=()=>{const o=(v,t)=>`<option value="${v}"${v==FL?' selected':''}>${t}</option>`;return o('all','Todos')+o('free','Libres (sin asignación)')+o('asg','Asignados (general)')+o('no','Sin participación')+'<optgroup label="Por área">'+AREAS.map(a=>o('area:'+a.id,a.h)).join('')+'</optgroup><optgroup label="Por rol">'+o('role:pres','Presidente')+o('role:jefe','Jefes de área')+o('role:axa','Auxiliares de área')+o('role:sup','Superintendentes / coordinadores de departamento')+o('role:aux','Auxiliares de departamento')+'</optgroup><optgroup label="Por departamento">'+AREAS.flatMap(a=>a.deps).map(d=>o('dep:'+d.id,d.n)).join('')+'</optgroup>'};
function vDir(){const c=S.people.length,nn=S.people.filter(p=>p.no).length,fr=S.people.filter(p=>!p.no&&!keysOf(p.id).length).length;
return `<h2>Directorio general (${c})</h2><p class="mu">${fr} libres · ${c-nn-fr} asignados · ${nn} sin participación</p>
<div class="cd"><div class="f"><label>Nombre<input id="n1"></label><label>Congregación<input id="n2"></label><label>Teléfono<input id="n3"></label><label>Correo<input id="n4"></label></div><div class="r"><button class="on" onclick="addP()">Agregar</button><label>Importar CSV o PDF: <input type="file" accept=".csv,.txt,.pdf" onchange="impC(this)"></label></div></div>
<div id="rv"></div>
<div class="r np" style="margin-bottom:8px"><input id="q" placeholder="Buscar por nombre, apellido o correo…" oninput="tb()" style="flex:1;min-width:200px"><select id="fl" onchange="FL=this.value;tb()">${flOpts()}</select><button onclick="pdfDirG()">Descargar PDF</button>${imgChk()}</div>
<div class="w"><table><thead><tr><th title="Marca a quien no acepta o no puede apoyar">Sin particip.</th><th>Nombre</th><th>Congregación</th><th>Teléfono</th><th>Correo</th><th>Asignación</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`}
function tb(){const q=nz(document.getElementById('q')?.value||'').split(/\s+/).filter(Boolean);document.getElementById('tb').innerHTML=S.people.filter(p=>match(p,FL)&&q.every(w=>nz(p.nombre+' '+p.cong+' '+p.correo).includes(w))).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=>`<tr class="${p.no?'mu':''}"><td><input type="checkbox" ${p.no?'checked':''} onchange="setNo('${p.id}',this.checked)"></td><td>${esc(p.nombre)}</td><td>${esc(p.cong)}</td><td>${esc(p.tel)}</td><td>${esc(p.correo)}</td><td>${esc(where(p))}</td><td><button onclick="delP('${p.id}')">Quitar</button></td></tr>`).join('')}
function addP(){const g=i=>document.getElementById(i).value.trim();if(!g('n1'))return;S.people.push({id:uid(),nombre:g('n1'),cong:g('n2'),tel:g('n3'),correo:g('n4')});lg('Agregó a '+g('n1')+' al directorio');save();render()}
function delP(id){if(!confirm('¿Quitar del directorio y de sus asignaciones?'))return;const pp=P(id);if(pp)lg('Quitó a '+pp.nombre+' del directorio');S.people=S.people.filter(p=>p.id!=id);for(const k in S.as)if(S.as[k]==id)delete S.as[k];save();render()}
function csv(t){t=t.replace(/^\uFEFF/,'');const l1=t.split(/\r?\n/,1)[0],d=l1.split(';').length>l1.split(',').length?';':',';const R=[];let o=[],c='',q=0;const fl=()=>{o.push(c);c='';if(o.some(x=>x.trim()))R.push(o.map(x=>x.trim()));o=[]};for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==d){o.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;fl()}else c+=h}fl();return R}
async function impC(i){const F=i.files[0];if(/\.pdf$/i.test(F.name))return impP(F);const r=csv(await F.text());if(!r.length)return;const h=r[0].map(x=>x.toLowerCase()),f=s=>h.findIndex(x=>s.test(x));const N=[f(/^nombre$/),f(/^segundo nombre/),f(/^apellidos/)].filter(x=>x>=0);let C,T1,T2,E,rows=r.slice(1);if(N.length){C=f(/^congregaci/);T1=f(/celular/);T2=f(/^tel[eé]fono$/);E=f(/correo|mail/)}else{rows=r;N.push(0);C=1;T1=2;T2=-1;E=3}const g=(c,k)=>k>=0?(c[k]||''):'';
const seen=new Set(S.people.map(p=>(p.correo||p.nombre).toLowerCase()));let n=0;rows.forEach(c=>{const p={id:uid(),nombre:N.map(k=>g(c,k)).filter(Boolean).join(' '),cong:g(c,C),tel:g(c,T1)||g(c,T2),correo:g(c,E)};const k=(p.correo||p.nombre).toLowerCase();if(!p.nombre||seen.has(k))return;seen.add(k);S.people.push(p);n++});lg('Importó '+n+' personas (CSV)');save();alert(n+' personas importadas ('+(rows.length-n)+' omitidas por vacías o duplicadas).');render()}
/* Asignación */
function selOld(k){const u=used(),cur=S.as[k];return `<select onchange="setA('${k}',this.value)"><option value="">— sin asignar —</option>${S.people.filter(p=>p.id==cur||!u.has(p.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=>`<option value="${p.id}"${p.id==cur?' selected':''}>${esc(p.nombre)}${p.cong?' · '+esc(p.cong):''}</option>`).join('')}</select>`}
function setA(k,v){const pr=S.as[k];if(v&&pr!=v&&used().has(v)){alert('Esa persona ya tiene otra asignación.');render();return}if(pr&&pr!=v){const q=P(pr);lg('Quitó a '+(q?q.nombre:'—')+' de '+kl(k))}if(v){if(pr!=v)lg('Asignó a '+P(v).nombre+': '+kl(k));S.as[k]=v}else delete S.as[k];save();render()}
function vAsg(){const a=AREAS.find(x=>x.id==AR);
return `<div class="r np">${AREAS.map(x=>`<button class="${x.id==AR?'on':''}" onclick="AR='${x.id}';render()">${x.h}</button>`).join('')}</div>

function cards(it){const PV=/^(Anciano|Siervo ministerial|Precursor( regular| auxiliar)?|Publicador( bautizado| no bautizado)?)$/i;
const LN=a=>{const G=[];a.slice().sort((p,q)=>p.t-q.t).forEach(x=>{let g=G.find(g=>Math.abs(g.t-x.t)<2.5);if(!g)G.push(g={t:x.t,c:[]});g.c.push(x)});return G.map(g=>g.c.sort((p,q)=>p.x-q.x).reduce((s,x,i,r)=>s+(i&&x.x-(r[i-1].x+r[i-1].w)>=1.5?' ':'')+x.s,''))};
const an=it.filter(a=>PV.test(a.s)).sort((a,b)=>a.t-b.t);
an.forEach((a,i)=>{const end=i+1<an.length?an[i+1].t-1:1e9,rg=it.filter(x=>x.t>=a.t-3&&x.t<end);
 const nx=rg.filter(x=>x.x>a.x+60&&Math.abs(x.t-a.t)<4).sort((p,q)=>p.x-q.x)[0];if(!nx)return;
 const nom=rg.filter(x=>Math.abs(x.x-nx.x)<6&&x.t>=a.t-3&&x.t<a.t+22&&!/correo|@/i.test(x.s)).sort((p,q)=>p.t-q.t).map(x=>x.s).join(' ');
 const cong=rg.filter(x=>x.x<a.x-20&&Math.abs(x.t-a.t)<4).map(x=>x.s).join(' ');
 const em=(LN(rg.filter(x=>x.x>=nx.x-6)).join(' ').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/)||[''])[0];
 const ph=LN(rg.filter(x=>x.x>=a.x-6&&x.x<nx.x-10&&x.t>a.t+10)).map(s=>(s.match(/\+?\d[\d\s().-]{5,}/)||[''])[0].trim()).filter(Boolean)[0]||'';
 const c=nom.indexOf(',');const nombre=c>0?nom.slice(c+1).trim()+' '+nom.slice(0,c).trim():nom;
 RV.push({nombre,cong,tel:ph,correo:em,ok:!!nombre})})}

async function impP(F){const rv=document.getElementById('rv');rv.innerHTML='Leyendo PDF…';
try{pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';

for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent(),L=[];cards(tc.items.filter(t=>t.str.trim()).map(t=>({x:t.transform[4],t:pg.view[3]-t.transform[5],w:t.width,s:t.str.trim()})));
tc.items.filter(t=>t.str.trim()).forEach(t=>{const y=t.transform[5];let l=L.find(l=>Math.abs(l.y-y)<3);if(!l)L.push(l={y,c:[]});l.c.push({x:t.transform[4],w:t.width,s:t.str.trim()})});
L.sort((a,b)=>b.y-a.y).forEach(l=>{l.c.sort((a,b)=>a.x-b.x);const cells=[];l.c.forEach((c,i)=>{const p=l.c[i-1];if(p&&c.x-(p.x+p.w)<6)cells[cells.length-1]+=' '+c.s;else cells.push(c.s)});rows.push(cells)})}
if(RV.length){rvR();return}const em=/[\w.+-]+@[\w-]+(\.[\w-]+)+/,ph=/\+?\d[\d\s().-]{7,}\d/;let hd=null;
rows.forEach(c=>{const j=c.join(' | ').toLowerCase();if(!hd&&/nombre/.test(j)&&/(correo|mail|tel)/.test(j)){hd=c.map(x=>x.toLowerCase());return}
const t=c.join('  '),e=(t.match(em)||[''])[0],tel=(t.match(ph)||[''])[0];if(!e&&!tel)return;let nombre,cong;
if(hd&&hd.length==c.length){const g=re=>{const k=hd.findIndex(x=>re.test(x));return k>=0?c[k]:''};nombre=g(/nombre/);cong=g(/cong/)}
else{const r=c.filter(x=>!x.includes('@')&&!ph.test(x));nombre=r[0]||'';cong=r[1]||''}
RV.push({nombre,cong,tel,correo:e,ok:!!nombre})});rvR()}catch(e){rv.innerHTML='<p class="wn">No se pudo leer el PDF: '+esc(e.message)+'</p>'}}
function rvR(){const rv=document.getElementById('rv');if(!RV.length){rv.innerHTML='<p class="wn">No se detectaron filas con teléfono o correo. Si el PDF es escaneado o tiene otro formato, conviértelo a CSV.</p>';return}
rv.innerHTML=`<div class="cd"><b>Revisión: ${RV.length} filas detectadas</b> <span class="mu">Corrige lo necesario y desmarca lo que no sirva.</span><div class="w"><table><tr><th></th><th>Nombre</th><th>Congregación</th><th>Teléfono</th><th>Correo</th></tr>${RV.map((r,i)=>`<tr><td><input type="checkbox" ${r.ok?'checked':''} onchange="RV[${i}].ok=this.checked"></td>${['nombre','cong','tel','correo'].map(k=>`<td><input value="${esc(r[k])}" oninput="RV[${i}].${k}=this.value"></td>`).join('')}</tr>`).join('')}</table></div><div class="r"><button onclick="rvOk()">Importar seleccionadas</button><button onclick="document.getElementById('rv').innerHTML=''">Cancelar</button></div></div>`}
function rvOk(){const seen=new Set(S.people.map(p=>(p.correo||p.nombre).toLowerCase()));let n=0;RV.filter(r=>r.ok&&r.nombre.trim()).forEach(r=>{const k=(r.correo||r.nombre).toLowerCase();if(seen.has(k))return;seen.add(k);S.people.push({id:uid(),nombre:r.nombre.trim(),cong:r.cong.trim(),tel:r.tel.trim(),correo:r.correo.trim()});n++});RV=[];lg('Importó '+n+' personas (PDF)');save();alert(n+' personas importadas.');render()}
async function ldT(i){TPL=await i.files[0].arrayBuffer();await idb('set',TPL);lss('asamblea-tpl-src','manual');TSRC='manual';render()}
async function mk(r){const {PDFDocument,StandardFonts,PDFName,PDFDict}=PDFLib,A=S.asm;const doc=await PDFDocument.load(TPL),form=doc.getForm(),pg=doc.getPage(0);
const fs=form.getFields().filter(f=>f.acroField.getWidgets().length).sort((a,b)=>b.acroField.getWidgets()[0].getRectangle().y-a.acroField.getWidgets()[0].getRectangle().y);
const v=[fcartaTxt(),r.p.nombre,r.puesto,A.ciudad,A.fechas,r.sup?r.sup.nombre:'',r.directo?r.directo.nombre:'',r.sup?r.sup.correo:'','"'+A.nombre+'"',''];
const fb=await doc.embedFont(StandardFonts.TimesRomanBold),fr=await doc.embedFont(StandardFonts.TimesRoman);
fs.forEach((f,i)=>{if(f.setText&&v[i]!==undefined)f.setText(v[i])});form.updateFieldAppearances(fb);
const hm=A.hmode||'texto',an=pg.node.Annots();if(hm!='ninguno'&&an)for(let i=an.size()-1;i>=0;i--){const a=an.lookup(i,PDFDict);if(a.get(PDFName.of('Subtype'))===PDFName.of('FreeText'))an.remove(i)}
const c=(t,y,s,f)=>pg.drawText(t,{x:(612-f.widthOfTextAtSize(t,s))/2,y,size:s,font:f});
if(hm=='texto'){c('ASAMBLEA REGIONAL DE LOS TESTIGOS DE JEHOVÁ',722,17,fb);c(A.tit2,704,12,fr);c(A.recinto,689,9,fr)}else if(hm=='imagen'&&HDR){const im=HDR.startsWith('data:image/png')?await doc.embedPng(HDR):await doc.embedJpg(HDR),sc=Math.min(612/im.width,128/im.height),w=im.width*sc,h=im.height*sc;pg.drawImage(im,{x:(612-w)/2,y:792-h,width:w,height:h})}return doc.save()}
const fym=()=>{const m=(fcartaTxt()||'').match(/^(\d\d)-(\d\d)-(\d{4})$/);if(m)return m[3]+m[2];const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')};
const fn=r=>[fym(),(S.asm.codigo||'').trim(),r.puesto+' - '+r.p.nombre].filter(Boolean).join(' ').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim()+'.pdf';

render();
